http:
  routers:
    # Task 9: /internal/* (metrics) is NEVER routed from the edge. Traefik has no "deny" middleware, so the router
    # wins on priority and an ipAllowList that nothing can match (RFC 5737 TEST-NET-1) answers 403 for everyone.
    # Prometheus scrapes app:8000/internal/metrics on the backend network instead. Proved by make obs-verify.
    internal-deny:
      rule: "PathPrefix(`/internal`)"
      entryPoints: [web]
      service: app
      priority: 100
      middlewares: [deny-all]
    app:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: app
      priority: 1
    reverb:
      rule: "PathPrefix(`/app/`)" # Task 8: /apps/ (signed HTTP API) is NOT routed; only the app container uses it, on the backend network
      entryPoints: [web]
      service: reverb
      priority: 10
    mailpit:
      rule: "Host(`mail.localhost`)"
      entryPoints: [web]
      service: mailpit
      priority: 20
  middlewares:
    deny-all:
      ipAllowList:
        sourceRange: ["192.0.2.1/32"] # unroutable documentation address: no client ever matches -> 403
  services:
    app:
      loadBalancer:
        servers:
          - url: "http://app:8000"
    reverb:
      loadBalancer:
        servers:
          - url: "http://reverb:8080"
    mailpit:
      loadBalancer:
        servers:
          - url: "http://mailpit:8025"
