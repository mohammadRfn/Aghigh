# Task 11: first-time server setup, idempotent. Target: Ubuntu 24.04 (a real VM: UFW, sysctl and THP are not real on WSL2).
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook playbook.yml --ask-vault-pass                  # apply
#   ansible-playbook playbook.yml --ask-vault-pass --check --diff   # second run must report no change
#   ansible-playbook playbook.yml --ask-vault-pass --tags app       # only re-render env files, units, deploy wrapper
- name: Aghigh production host
  hosts: production
  become: true
  gather_facts: true
  pre_tasks:
    - name: Refuse anything but Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
        fail_msg: "This playbook was written for Ubuntu 24.04 (found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})."
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: firewall
      tags: [firewall]
    - role: fail2ban
      tags: [fail2ban]
    - role: unattended_upgrades
      tags: [unattended_upgrades]
    - role: sysctl
      tags: [sysctl]
    - role: docker
      tags: [docker]
    - role: app
      tags: [app]
