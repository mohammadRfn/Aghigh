# Task 11: build the Postgres + pgBackRest image (docker/postgres/Dockerfile). Manual on purpose: the tag is
# referenced by POSTGRES_BACKUP_IMAGE on the server, and switching it recreates Postgres (not zero-downtime).
# After the run copy the printed `pgbackrest version` and the image digest into docs/deploy/image-digests.md.
name: Postgres backup image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 18-pgbackrest-1 (never reuse a tag)"
        type: string
        required: true

permissions:
  contents: read

env:
  POSTGRES_BASE_IMAGE: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        env:
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "invalid tag"; exit 1; }
          echo "image=$REGISTRY/${OWNER,,}/aghigh-postgres:$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: |
            POSTGRES_BASE_IMAGE=${{ vars.REGISTRY_PREFIX }}${{ env.POSTGRES_BASE_IMAGE }}
      - name: Record versions
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "image:  $IMAGE"
            echo "digest: $DIGEST"
            echo "pgbackrest: $(docker run --rm --entrypoint pgbackrest "$IMAGE" version)"
            echo "postgres:   $(docker run --rm --entrypoint postgres "$IMAGE" --version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
